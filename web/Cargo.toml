[package]
name = "oligo_poly_web"
version = "0.1.0"
edition = "2024"
publish = false
description = "The web page of atomic_hilbert: equivariant Gröbner bases in the browser."

[lib]
# cdylib for the wasm module of the page, rlib for the native tests.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "equivariant-groebner"
path = "src/main.rs"

[dependencies]
atomic_hilbert = { path = "..", features = ["atoms"] }
num-rational = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
