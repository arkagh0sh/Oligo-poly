name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # The equivariant feature builds rug, which compiles GMP from source.
      - name: Test with the equivariant feature
        run: cargo test --features equivariant
      - name: Clippy with the equivariant feature
        run: cargo clippy --all-targets --features equivariant -- -D warnings
