# Builds the single-file web page (web/dist/index.html) and publishes it on
# GitHub Pages. In the repository settings, Pages must use the source
# "GitHub Actions". The page is also kept as a downloadable artifact of the run.
name: Web page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test the interface of the page
        run: cargo test --release --manifest-path web/Cargo.toml
      - name: Build the page
        run: web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: equivariant-groebner-page
          path: web/dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
