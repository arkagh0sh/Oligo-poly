# Builds the desktop program equivariant-groebner for Linux, macOS and Windows.
# Each run keeps the programs as downloadable artifacts. A tag v* also
# publishes them in a GitHub release.
name: Desktop program

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: equivariant-groebner-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: equivariant-groebner-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: equivariant-groebner-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: equivariant-groebner-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --manifest-path web/Cargo.toml --bin equivariant-groebner --target ${{ matrix.target }}
      - name: Name the program
        shell: bash
        run: |
          mkdir -p out
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          cp "web/target/${{ matrix.target }}/release/equivariant-groebner$suffix" "out/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: programs
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: programs/*
