[package]
name = "atomic_hilbert"
version = "0.1.0"
edition = "2024"

[features]
# The equivariant framework and the symbolic atoms. They are pure Rust, so they
# also build for WebAssembly.
atoms = ["dep:itertools", "dep:varisat"]
# The concrete atoms DLO and Tree as well, which use rug (GMP).
equivariant = ["atoms", "dep:rug"]

[dependencies]
itertools = { version = "0.14.0", optional = true }
num-rational = "0.4"
num-traits = "0.2"
rug = { version = "1.27", optional = true }
varisat = { version = "0.2.2", optional = true }

[[example]]
name = "equivariant_demo"
required-features = ["equivariant"]

[[example]]
name = "finite_comparison"
required-features = ["equivariant"]

[[example]]
name = "elimination_comparison"
required-features = ["equivariant"]

[[example]]
name = "elimination_scaling"
required-features = ["equivariant"]

[[example]]
name = "profile_products"
required-features = ["atoms"]

[[example]]
name = "scaling_atoms"
required-features = ["equivariant"]
