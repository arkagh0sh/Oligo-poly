[package]
name = "atomic_hilbert"
version = "0.1.0"
edition = "2024"

[features]
# The equivariant framework (atoms.rs, dlo.rs, elements_with_atoms.rs) is still
# under development and is only built when this feature is enabled.
equivariant = ["dep:rug", "dep:itertools"]
# Symbolic atoms (work in progress); does not need rug, so it also builds for WebAssembly.
symbolic = []

[dependencies]
itertools = { version = "0.14.0", optional = true }
num-traits = "0.2"
rug = { version = "1.27", optional = true }

[dev-dependencies]
num-rational = "0.4"

[[example]]
name = "equivariant_demo"
required-features = ["equivariant"]

[[example]]
name = "finite_comparison"
required-features = ["equivariant"]

[[example]]
name = "elimination_comparison"
required-features = ["equivariant"]

[[example]]
name = "elimination_scaling"
required-features = ["equivariant"]
